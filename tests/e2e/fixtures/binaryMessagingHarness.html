<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Binary Messaging Harness</title>
  </head>
  <body>
    <main id="messages">
      <article id="binary-message" data-tid="chat-pane-message">
        <div data-tid="message-body">
          <div data-tid="messageBodyContent" dir="auto">01001000 01100101 01101100 01101100 01101111</div>
        </div>
      </article>
      <article id="normal-message" data-tid="chat-pane-message">
        <div dir="auto">Meeting at 10:10</div>
      </article>
    </main>
    <section id="composer-shell">
      <div id="new-message-test" contenteditable="true" role="textbox" aria-label="Type a message"></div>
      <div role="toolbar" aria-label="Message actions">
        <button type="button" aria-label="Emoji">Emoji</button>
        <button id="send-message" type="button" data-tid="sendMessageCommands-send" aria-label="Send (Ctrl+Enter)">Send</button>
      </div>
    </section>
    <script>
      globalThis.sentMessages = [];
      globalThis.editorModelWrites = 0;
      globalThis.editorCommandWrites = 0;
      let teamsDraftState = "";
      const composer = document.getElementById("new-message-test");
      const modelRoot = {};
      composer.ckeditorInstance = {
        commands: {
          get: (name) =>
            name === "selectAll" || name === "insertText"
              ? { isEnabled: true }
              : undefined,
        },
        execute: (name, options = {}) => {
          if (name === "selectAll") return;
          if (name !== "insertText") throw new Error(`Unknown command: ${name}`);

          composer.textContent = options.text;
          teamsDraftState = options.text;
          globalThis.editorCommandWrites += 1;
        },
        model: {
          document: {
            getRoot: () => modelRoot,
          },
          change: (callback) => {
            let nextText = "";
            callback({
              createRangeIn: () => ({}),
              remove: () => {},
              createElement: () => ({}),
              append: () => {},
              insertText: (text) => {
                nextText = text;
              },
              setSelection: () => {},
            });
            composer.textContent = nextText;
            globalThis.editorModelWrites += 1;
          },
        },
        editing: {
          view: {
            focus: () => composer.focus(),
          },
        },
      };
      composer.addEventListener("input", () => {
        queueMicrotask(() => {
          teamsDraftState = composer.innerText;
        });
      });
      document.getElementById("send-message").addEventListener("click", () => {
        globalThis.sentMessages.push(teamsDraftState);
      });
      composer.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && event.ctrlKey && !event.shiftKey) {
          globalThis.sentMessages.push(teamsDraftState);
        }
      });
    </script>
  </body>
</html>
